version: '3.8'
services:
  postgres:
    image: postgres:15.0-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432"
    environment:
      - POSTGRES_USER=${db_user}
      - POSTGRES_PASSWORD=${db_password}
      - POSTGRES_DB=${db_name}
    env_file:
      - ./server/.env.prod
  backend:
    build: ./server
    command: sh -c "gunicorn --workers=4 --bind 0.0.0.0:8000 server.wsgi:application"
    volumes:
      - static_data:/usr/src/server/static
      - media_data:/usr/src/server/media
    environment:
      - env_file=.env.prod
    depends_on:
      - postgres
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_data:/usr/src/server/static/
      - media_data:/usr/src/server/media/
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf:/etc/letsencrypt/:ro
    depends_on:
      - backend
  telegram:
    build: ./telegram
    restart: always
    volumes:
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf:/etc/letsencrypt/:ro
      - cache_data:/usr/src/telegram/cache/
    environment:
      - env_file=.env.prod

volumes:
  postgres_data:
  backup_data:
  cache_data:
  media_data:
  static_data: